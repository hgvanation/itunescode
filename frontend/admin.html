<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Quản Trị Kho Mã Code</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --border: #e5e7eb;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }

    .container { width: 100%; max-width: 900px; margin-top: 30px; }
    .card { background: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
    
    h1, h2 { font-size: 1.25rem; margin-bottom: 16px; font-weight: 600; }
    .hidden { display: none !important; }

    /* Form Styles */
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 0.875rem; font-weight: 500; }
    input[type="text"], input[type="password"], textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; transition: border 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 120px; font-family: monospace; }

    button {
      background-color: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 500; cursor: pointer; transition: background 0.2s;
    }
    button:hover { background-color: var(--primary-hover); }
    .btn-logout { background-color: #6b7280; float: right; padding: 6px 12px; font-size: 0.85rem; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
    .stat-card { background: var(--card-bg); padding: 16px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-top: 4px; }

    /* Messages & Lists */
    .alert { padding: 12px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 16px; display: none; }
    .alert-danger { background-color: #fee2e2; color: #991b1b; }
    .alert-success { background-color: #d1fae5; color: #065f46; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
    th { background-color: #f9fafb; font-weight: 600; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .badge-available { background-color: #d1fae5; color: #065f46; }
    .badge-used { background-color: #f3f4f6; color: #6b7280; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ALERT BOX THÔNG BÁO -->
    <div id="alertBox" class="alert"></div>

    <!-- 1. FORM ĐĂNG NHẬP ADMIN -->
    <div id="loginSection" class="card" style="max-width: 400px; margin: 50px auto;">
      <h1>Đăng Nhập Admin</h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Tài khoản Admin</label>
          <input type="text" id="username" placeholder="Nhập tài khoản..." required>
        </div>
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" placeholder="Nhập mật khẩu..." required>
        </div>
        <button type="submit" style="width: 100%;">Đăng Nhập</button>
      </form>
    </div>

    <!-- 2. BẢNG ĐIỀU KHIỂN DÀNH CHO ADMIN (Ẩn mặc định) -->
    <div id="dashboardSection" class="hidden">
      
      <div style="overflow: hidden; margin-bottom: 16px;">
        <button id="btnLogout" class="btn-logout">Đăng xuất</button>
        <h1 style="float: left;">Quản Lý Kho Mã Code</h1>
      </div>

      <!-- Thống kê kho code -->
      <div class="stats-grid">
        <div class="stat-card">
          <div>Tổng số mã</div>
          <div id="statTotal" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div>Còn tồn (Chưa cấp)</div>
          <div id="statAvailable" class="stat-value" style="color: var(--success);">0</div>
        </div>
        <div class="stat-card">
          <div>Đã cấp cho khách</div>
          <div id="statUsed" class="stat-value" style="color: var(--danger);">0</div>
        </div>
      </div>

      <!-- Form dán danh sách mã nạp kho -->
      <div class="card">
        <h2>Nạp Thêm Mã Vào Kho</h2>
        <form id="addCodesForm">
          <div class="form-group">
            <label for="rawCodes">Dán danh sách mã (Mỗi mã nằm trên một dòng hoặc phân tách bằng dấu phẩy):</label>
            <textarea id="rawCodes" placeholder="Ví dụ:&#10;DISCOUNT100K&#10;DISCOUNT200K&#10;GIFTMAY2026" required></textarea>
          </div>
          <button type="submit">Nạp Vào Kho</button>
        </form>
      </div>

      <!-- Bảng lịch sử nhận mã -->
      <div class="card">
        <h2>Lịch Sử Cấp Mã (Mới Nhất)</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Mã Code</th>
              <th>Email / Threads ID Nhận</th>
              <th>Thời Gian Cấp</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr><td colspan="4" style="text-align: center;">Chưa có dữ liệu</td></tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>

  <script>
    // ĐỔI THÀNH URL BACKEND CỦA BẠN KHI DEPLOY (VD: https://code-distribution-backend.onrender.com)
    const API_BASE_URL = 'http://localhost:3000/api/v1';

    // Elements
    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const alertBox = document.getElementById('alertBox');

    // Hàm hiển thị thông báo
    function showAlert(message, isError = false) {
      alertBox.textContent = message;
      alertBox.className = `alert ${isError ? 'alert-danger' : 'alert-success'}`;
      alertBox.style.display = 'block';
      setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
    }

    // Kiểm tra trạng thái Đăng nhập từ LocalStorage khi mở trang
    const token = localStorage.getItem('adminToken');
    if (token) {
      showDashboard();
    }

    // 1. XỬ LÝ ĐĂNG NHẬP
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch(`${API_BASE_URL}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('adminToken', data.token);
          showAlert('Đăng nhập thành công!');
          showDashboard();
        } else {
          showAlert(data.message || 'Thất bại!', true);
        }
      } catch (err) {
        showAlert('Không thể kết nối đến máy chủ Backend!', true);
      }
    });

    // 2. HIỂN THỊ DASHBOARD & TẢI DỮ LIỆU
    function showDashboard() {
      loginSection.classList.add('hidden');
      dashboardSection.classList.remove('hidden');
      loadStats();
      loadHistory();
    }

    // Lấy thống kê số lượng mã
    async function loadStats() {
      const token = localStorage.getItem('adminToken');
      try {
        const res = await fetch(`${API_BASE_URL}/admin/codes`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('statTotal').textContent = data.stats.total;
          document.getElementById('statAvailable').textContent = data.stats.available;
          document.getElementById('statUsed').textContent = data.stats.used;
        }
      } catch (err) { console.error('Lỗi tải thống kê:', err); }
    }

    // Lấy lịch sử khách nhận mã
    async function loadHistory() {
      const token = localStorage.getItem('adminToken');
      try {
        const res = await fetch(`${API_BASE_URL}/admin/history`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success && data.data.length > 0) {
          const tbody = document.getElementById('historyTableBody');
          tbody.innerHTML = data.data.map(item => `
            <tr>
              <td>#${item.id}</td>
              <td><strong>${item.code}</strong></td>
              <td>${item.recipient_identifier}</td>
              <td>${new Date(item.claimed_at).toLocaleString('vi-VN')}</td>
            </tr>
          `).join('');
        }
      } catch (err) { console.error('Lỗi tải lịch sử:', err); }
    }

    // 3. XỬ LÝ NẠP DẠNG DANH SÁCH MÃ
    document.getElementById('addCodesForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawText = document.getElementById('rawCodes').value;
      const token = localStorage.getItem('adminToken');

      // Tách chuỗi theo dấu xuống dòng hoặc dấu phẩy
      const codesArray = rawText
        .split(/[\n,]+/)
        .map(code => code.trim())
        .filter(code => code.length > 0);

      if (codesArray.length === 0) {
        showAlert('Vui lòng dán danh sách mã hợp lệ!', true);
        return;
      }

      try {
        const res = await fetch(`${API_BASE_URL}/admin/codes`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ codes: codesArray })
        });
        const data = await res.json();

        if (data.success) {
          let msg = `Thành công! Đã thêm ${data.data.addedCount} mã mới.`;
          if (data.data.duplicateCount > 0) {
            msg += ` (Phát hiện ${data.data.duplicateCount} mã lặp bị bỏ qua: ${data.data.duplicates.join(', ')})`;
          }
          showAlert(msg, false);
          document.getElementById('rawCodes').value = ''; // Reset form
          loadStats(); // Tải lại số liệu
        } else {
          showAlert(data.message || 'Lỗi khi nạp mã!', true);
        }
      } catch (err) {
        showAlert('Lỗi kết nối máy chủ!', true);
      }
    });

    // 4. XỬ LÝ ĐĂNG XUẤT
    document.getElementById('btnLogout').addEventListener('click', () => {
      localStorage.removeItem('adminToken');
      dashboardSection.classList.add('hidden');
      loginSection.classList.remove('hidden');
      showAlert('Đã đăng xuất!');
    });
  </script>
</body>
</html>
